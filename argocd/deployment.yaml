apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  labels:
    app: argocd-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-server
  template:
    metadata:
      labels:
        app: argocd-server
    spec:
      containers:
      - name: argocd-server
        # Using a stable pinned version of ArgoCD
        image: quay.io/argoproj/argocd:v2.10.4
        command: ["argocd-server", "--insecure"] # --insecure skips local SSL for easy laptop testing
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"